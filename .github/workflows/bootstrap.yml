name: Bootstrap piattaforma Android

# Eseguire questo workflow UNA VOLTA, a mano, dalla tab "Actions" del
# repository (Bootstrap piattaforma Android -> Run workflow), per generare
# la cartella android/ che Flutter richiede per compilare un APK. Le build
# successive (vedi build-apk.yml) partono da quello che questo workflow
# genera e committa. Va rieseguito solo se si vuole rigenerare android/ da
# zero (per esempio dopo un aggiornamento importante di Flutter).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Backup dei file scritti a mano (pubspec.yaml, lib/)
        run: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp -r lib /tmp/backup/lib

      - name: Genera la piattaforma Android mancante
        run: |
          flutter create --platforms=android --org com.pietrofabbri.allenamento --project-name allenamento .

      - name: Ripristina i file scritti a mano
        run: |
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/backup/lib lib

      - name: Commit della piattaforma generata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/ pubspec.yaml lib/
          git diff --cached --quiet || git commit -m "Bootstrap: genera la piattaforma Android (flutter create)"
          git push
