name: Bootstrap piattaforma Android

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Versione fissata (non "channel: stable") e IDENTICA in
          # bootstrap.yml e build-apk.yml. Le versioni recenti di Flutter
          # generano solo Gradle in Kotlin DSL (build.gradle.kts) e
          # "flutter build apk" su quella toolchain ha fallito cercando il
          # vecchio build.gradle Groovy (vedi docs/ARCHITETTURA.md sez. 7).
          # 3.24.x genera Gradle in Groovy classico: elimina il problema.
          flutter-version: '3.24.x'

      - name: Backup dei file scritti a mano (pubspec.yaml, lib/)
        run: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp -r lib /tmp/backup/lib

      - name: Genera la piattaforma Android mancante
        run: |
          flutter create --platforms=android --org com.pietrofabbri.allenamento --project-name allenamento .

      - name: Ripristina i file scritti a mano
        run: |
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/backup/lib lib

      - name: Commit della piattaforma generata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/ pubspec.yaml lib/
          git diff --cached --quiet || git commit -m "Bootstrap: genera la piattaforma Android (flutter create)"
          git push
