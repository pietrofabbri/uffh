name: Build APK

# Compila un APK di debug (installabile via "sideload", nessuna firma di
# release richiesta) a ogni push su main, e lo allega come artifact
# scaricabile dalla pagina della run in Actions. Richiede che
# bootstrap.yml sia gia' stato eseguito almeno una volta (deve esistere
# la cartella android/).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'

      - run: flutter pub get

      - run: flutter test

      - run: flutter clean

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: allenamento-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
