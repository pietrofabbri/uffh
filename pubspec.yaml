name: allenamento
description: >
  App di allenamento a corpo libero (calisthenics) con motore di
  progressione per categoria (spinta, trazione, core, gambe, flessibilita',
  equilibrio), pensata per pavimento, muro e fascia elastica.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
